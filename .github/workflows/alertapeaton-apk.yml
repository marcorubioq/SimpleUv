name: Build AlertaPeaton APK

on:
  push:
    branches: [alertapeaton-build]
    paths:
      - 'AlertaPeaton/**'
      - '.github/workflows/alertapeaton-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Download PIDNet semantic segmentation model
        run: |
          mkdir -p AlertaPeaton/app/src/main/assets
          curl -L --fail --retry 3 \
            'https://huggingface.co/litert-community/PIDNet-S-Cityscapes-LiteRT/resolve/main/pidnet_s.tflite?download=true' \
            -o AlertaPeaton/app/src/main/assets/pidnet_s.tflite
          test -s AlertaPeaton/app/src/main/assets/pidnet_s.tflite

      - name: Build debug APK
        working-directory: AlertaPeaton
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlertaPeaton-test-apk
          path: AlertaPeaton/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
